workflows:
  ios-build:
    name: OnlyPBS iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build frontend and sync Capacitor
        script: npm run cap:sync
      - name: Build iOS app
        script: |
          xcode-project build \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --configuration Release \
            --sdk iphoneos \
            --destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /Users/builder/clone/ios/App/build/Build/Products/Release-iphoneos/*.app
